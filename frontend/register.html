<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabinet Médical — Inscription</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  body {
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    padding: 2rem 0;
  }
  .register-card {
    background: white;
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .logo {
    background: #16a34a;
    color: white;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 1.5rem;
  }
  .btn-success-custom {
    background: #16a34a;
    border: none;
    padding: 0.75rem;
    font-size: 1rem;
    border-radius: 8px;
    color: white;
    width: 100%;
  }
  .btn-success-custom:hover { background: #15803d; color: white; }
  .form-control {
    border-radius: 8px;
    padding: 0.75rem 1rem;
    border: 1px solid #dde3ec;
    font-size: 14px;
  }
  .form-control:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
  }
  .input-group-text {
    background: #f8fafc;
    border: 1px solid #dde3ec;
    color: #6b7280;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.2rem 0;
    color: #9ca3af;
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e5e7eb;
  }
  .badge-patient {
    background: #dcfce7;
    color: #16a34a;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }
  label { font-size: 14px; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="register-card">

  <!-- Logo -->
  <div class="logo">
    <i class="bi bi-person-plus"></i>
  </div>

  <h4 class="text-center fw-bold mb-1" style="color:#1a2332;">Créer un compte</h4>
  <p class="text-center text-muted mb-1" style="font-size:14px;">Cabinet Médical — Espace Patient</p>
  <div class="text-center mb-4">
    <span class="badge-patient"><i class="bi bi-person me-1"></i>Compte Patient</span>
  </div>

  <div class="alert alert-info" style="font-size:13px; border-radius:8px;">
    <i class="bi bi-info-circle me-1"></i>
    Cette page est réservée à l'inscription des <strong>patients</strong> uniquement.
  </div>

  <!-- Erreur -->
  <div class="alert alert-danger d-none" id="form-error" style="border-radius:8px;font-size:14px;"></div>

  <div class="divider">Informations personnelles</div>

  <div class="row g-3">
    <!-- Prénom -->
    <div class="col-md-6">
      <label class="form-label">Prénom <span class="text-danger">*</span></label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="f-prenom" class="form-control" placeholder="Prénom">
      </div>
    </div>

    <!-- Nom -->
    <div class="col-md-6">
      <label class="form-label">Nom <span class="text-danger">*</span></label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="f-nom" class="form-control" placeholder="Nom de famille">
      </div>
    </div>

    <!-- Email -->
    <div class="col-12">
      <label class="form-label">Email</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" id="f-email" class="form-control" placeholder="email@exemple.com">
      </div>
    </div>

    <!-- Téléphone -->
    <div class="col-12">
      <label class="form-label">Téléphone</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
        <input type="text" id="f-telephone" class="form-control" placeholder="06XXXXXXXX">
      </div>
    </div>
  </div>

  <div class="divider">Identifiants de connexion</div>

  <div class="row g-3">
    <!-- Username -->
    <div class="col-12">
      <label class="form-label">Nom d'utilisateur <span class="text-danger">*</span></label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-at"></i></span>
        <input type="text" id="f-username" class="form-control" placeholder="username">
      </div>
    </div>

    <!-- Password -->
    <div class="col-md-6">
      <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="f-password" class="form-control" placeholder="••••••••">
        <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('f-password','eye1')">
          <i class="bi bi-eye" id="eye1"></i>
        </button>
      </div>
    </div>

    <!-- Confirmer Password -->
    <div class="col-md-6">
      <label class="form-label">Confirmer <span class="text-danger">*</span></label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="f-password2" class="form-control" placeholder="••••••••">
        <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('f-password2','eye2')">
          <i class="bi bi-eye" id="eye2"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Bouton -->
  <button class="btn-success-custom mt-4" onclick="register()" id="btn-register">
    <span id="btn-text"><i class="bi bi-person-check me-2"></i>Créer mon compte</span>
    <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
  </button>

  <p class="text-center mt-3" style="font-size:14px; color:#6b7280;">
    Déjà un compte ?
    <a href="index.html" style="color:#1a6fc4; text-decoration:none; font-weight:500;">Se connecter</a>
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = "http://127.0.0.1:8000/api";

function togglePwd(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon  = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
  }
}

async function register() {
  const errDiv   = document.getElementById('form-error');
  const spinner  = document.getElementById('btn-spinner');
  const btnText  = document.getElementById('btn-text');
  const btn      = document.getElementById('btn-register');

  errDiv.classList.add('d-none');

  const prenom    = document.getElementById('f-prenom').value.trim();
  const nom       = document.getElementById('f-nom').value.trim();
  const email     = document.getElementById('f-email').value.trim();
  const telephone = document.getElementById('f-telephone').value.trim();
  const username  = document.getElementById('f-username').value.trim();
  const password  = document.getElementById('f-password').value;
  const password2 = document.getElementById('f-password2').value;

  /* Validation */
  if (!prenom || !nom || !username || !password || !password2) {
    errDiv.textContent = 'Veuillez remplir tous les champs obligatoires (*).';
    errDiv.classList.remove('d-none');
    return;
  }
  if (password !== password2) {
    errDiv.textContent = 'Les mots de passe ne correspondent pas.';
    errDiv.classList.remove('d-none');
    return;
  }
  if (password.length < 6) {
    errDiv.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
    errDiv.classList.remove('d-none');
    return;
  }

  spinner.classList.remove('d-none');
  btnText.innerHTML = 'Création en cours...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/users/register_patient/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username,
        password,
        password2,
        first_name: prenom,
        last_name:  nom,
        email,
        telephone
      })
    });

    const data = await res.json();

    if (res.ok) {
      Swal.fire({
        icon: 'success',
        title: 'Compte créé !',
        text: `Bienvenue ${prenom} ! Votre compte patient a été créé avec succès.`,
        timer: 2500,
        showConfirmButton: false
      }).then(() => {
        window.location.href = 'index.html';
      });

    } else {
      const msg = data.username?.[0]
        || data.password?.[0]
        || data.email?.[0]
        || data.non_field_errors?.[0]
        || data.detail
        || 'Erreur lors de la création du compte.';
      errDiv.textContent = msg;
      errDiv.classList.remove('d-none');
    }

  } catch(e) {
    errDiv.textContent = 'Impossible de contacter le serveur. Vérifiez que Django tourne.';
    errDiv.classList.remove('d-none');
  }

  spinner.classList.add('d-none');
  btnText.innerHTML = '<i class="bi bi-person-check me-2"></i>Créer mon compte';
  btn.disabled = false;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') register();
});
</script>

</body>
</html>
