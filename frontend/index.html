<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabinet Médical — Connexion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  body {
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
  }
  .login-card {
    background: white;
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .logo {
    background: #1a6fc4;
    color: white;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 1.5rem;
  }
  .btn-primary {
    background: #1a6fc4;
    border: none;
    padding: 0.75rem;
    font-size: 1rem;
    border-radius: 8px;
  }
  .btn-primary:hover { background: #155aa0; }
  .form-control {
    border-radius: 8px;
    padding: 0.75rem 1rem;
    border: 1px solid #dde3ec;
  }
  .form-control:focus {
    border-color: #1a6fc4;
    box-shadow: 0 0 0 3px rgba(26,111,196,0.12);
  }
  .input-group-text {
    background: #f8fafc;
    border-radius: 8px 0 0 8px;
    border: 1px solid #dde3ec;
  }
</style>
</head>
<body>

<div class="login-card">

  <div class="logo">
    <i class="bi bi-hospital"></i>
  </div>

  <h4 class="text-center fw-bold mb-1" style="color:#1a2332;">
    Cabinet Médical
  </h4>

  <p class="text-center text-muted mb-4" style="font-size:14px;">
    Connectez-vous à votre espace
  </p>

  <!-- Username -->
  <div class="mb-3">
    <label class="form-label">Nom d'utilisateur</label>
    <div class="input-group">
      <span class="input-group-text">
        <i class="bi bi-person"></i>
      </span>
      <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur">
    </div>
  </div>

  <!-- Password -->
  <div class="mb-4">
    <label class="form-label">Mot de passe</label>
    <div class="input-group">
      <span class="input-group-text">
        <i class="bi bi-lock"></i>
      </span>
      <input type="password" id="password" class="form-control" placeholder="Mot de passe">
      <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
        <i class="bi bi-eye" id="eye-icon"></i>
      </button>
    </div>
  </div>

  <!-- Bouton -->
  <button class="btn btn-primary w-100" onclick="login()" id="btn-login">
    <span id="btn-text">Se connecter</span>
    <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
  </button>

  <p class="text-center mt-4 text-muted" style="font-size:13px;">
    <i class="bi bi-shield-lock me-1"></i>
    Accès sécurisé — Cabinet Médical © 2026
  </p>

  <p class="text-center mt-2" style="font-size:14px;">
    Pas encore de compte ?
    <a href="register.html" style="color:#1a6fc4; text-decoration:none;">Créer un compte</a>
  </p>

</div>

<script>
const API = "http://127.0.0.1:8000/api";

function togglePassword() {
  const pwd = document.getElementById("password");
  const icon = document.getElementById("eye-icon");
  if (pwd.type === "password") {
    pwd.type = "text";
    icon.className = "bi bi-eye-slash";
  } else {
    pwd.type = "password";
    icon.className = "bi bi-eye";
  }
}

async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const spinner  = document.getElementById("btn-spinner");
  const btnText  = document.getElementById("btn-text");
  const btn      = document.getElementById("btn-login");

  if (!username || !password) {
    Swal.fire({
      icon: "warning",
      title: "Champs obligatoires",
      text: "Veuillez remplir tous les champs"
    });
    return;
  }

  spinner.classList.remove("d-none");
  btnText.textContent = "Connexion...";
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/token/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
  localStorage.setItem("access", data.access);
  localStorage.setItem("refresh", data.refresh);
  localStorage.setItem("username", username);

  // Récupérer le rôle de l'utilisateur
  const meRes = await fetch(`${API}/users/me/`, {
    headers: {
      "Authorization": `Bearer ${data.access}`,
      "Content-Type": "application/json"
    }
  });
  const me = await meRes.json();
  localStorage.setItem("role", me.role);
  localStorage.setItem("user_id", me.id);

  // Redirection selon le rôle
  const role = (me.role || "").toLowerCase().trim();

switch (role) {
  case 'patient':
    window.location.href = "patient_dashboard.html";
    break;

  case 'medecin':
    window.location.href = "medecin_dashboard.html";
    break;

  case 'secretaire':
    window.location.href = "secretaire_dashboard.html";
    break;

  case 'admin':
    window.location.href = "dashboard.html";
    break;

  default:
    Swal.fire({
      icon: "error",
      title: "Rôle inconnu",
      text: "Contactez l'administrateur"
    });
}
    }
  } catch (error) {
    Swal.fire({
      icon: "error",
      title: "Serveur indisponible",
      text: "Vérifiez que Django tourne sur http://127.0.0.1:8000"
    });
  }

  spinner.classList.add("d-none");
  btnText.textContent = "Se connecter";
  btn.disabled = false;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
