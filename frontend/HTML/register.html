<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — MediCare Pro</title>
    <meta name="description" content="Créez votre compte patient sur MediCare Pro.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: #7c3aed;
            filter: blur(80px);
            opacity: 0.12;
            top: -150px;
            right: -150px;
            animation: pulse 7s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #06b6d4;
            filter: blur(80px);
            opacity: 0.12;
            bottom: -80px;
            left: -80px;
            animation: pulse 5s ease-in-out infinite reverse;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 44px 40px;
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .auth-logo-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .auth-logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .auth-logo-text span {
            color: #38bdf8;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 28px;
        }

        .role-info {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #a78bfa;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i.fa {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 14px;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 13px 14px 13px 42px;
            font-size: 14px;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        /* Indicateur force du mot de passe */
        .pwd-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            width: 0;
            transition: width 0.4s, background 0.4s;
        }

        .strength-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #475569;
            font-size: 14px;
            background: none;
            border: none;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #a78bfa;
        }

        /* Checklist password */
        .pwd-checks {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .pwd-check {
            font-size: 11px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pwd-check i {
            font-size: 10px;
        }

        .pwd-check.ok {
            color: #34d399;
        }

        .btn-register {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .alert.show {
            display: flex;
        }

        .alert-error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(5, 150, 105, 0.15);
            border: 1px solid rgba(5, 150, 105, 0.4);
            color: #6ee7b7;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #64748b;
        }

        .auth-footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
            margin-top: 14px;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fa-solid fa-user-plus"></i></div>
            <div class="auth-logo-text">Medi<span>Care</span> Pro</div>
        </div>

        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-subtitle">Inscrivez-vous en tant que patient</p>

        <div class="role-info">
            <i class="fa-solid fa-circle-info"></i>
            <span>L'inscription crée un compte <strong>Patient</strong>. Les autres rôles sont assignés par
                l'administrateur.</span>
        </div>

        <div class="alert alert-error" id="alertError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alertErrMsg">Erreur</span>
        </div>
        <div class="alert alert-success" id="alertSuccess">
            <i class="fa-solid fa-circle-check"></i>
            <span id="alertSuccessMsg">Succès</span>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="nom">Nom complet</label>
                <div class="input-wrap">
                    <i class="fa fa-user"></i>
                    <input type="text" id="nom" placeholder="Mohamed Alami" required minlength="3">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <div class="input-wrap">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="email" placeholder="vous@exemple.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-wrap">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required
                        oninput="checkStrength(this.value)">
                    <button type="button" class="toggle-password" onclick="togglePwd()">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <div class="pwd-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Entrez un mot de passe</div>
                </div>
                <div class="pwd-checks">
                    <div class="pwd-check" id="chk-len"><i class="fa-solid fa-circle-xmark"></i> 6 caractères min.</div>
                    <div class="pwd-check" id="chk-upper"><i class="fa-solid fa-circle-xmark"></i> Majuscule</div>
                    <div class="pwd-check" id="chk-num"><i class="fa-solid fa-circle-xmark"></i> Chiffre</div>
                    <div class="pwd-check" id="chk-special"><i class="fa-solid fa-circle-xmark"></i> Caractère spécial
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <div class="input-wrap">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <i class="fa-solid fa-user-plus"></i> Créer mon compte
            </button>
        </form>

        <div class="auth-footer">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
        <a href="../HTML/Index .html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
        </a>
    </div>

    <script src="../JS/auth.js"></script>
    <script>
        // Rediriger si déjà connecté
        const existingSession = getSession();
        if (existingSession) {
            window.location.href = ROLE_DASHBOARDS[existingSession.role];
        }

        function togglePwd() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.className = input.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        }

        function checkStrength(pwd) {
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            const checks = {
                len: pwd.length >= 6,
                upper: /[A-Z]/.test(pwd),
                num: /[0-9]/.test(pwd),
                special: /[^A-Za-z0-9]/.test(pwd)
            };
            // Update checkmarks
            Object.entries(checks).forEach(([key, ok]) => {
                const el = document.getElementById('chk-' + key);
                el.className = 'pwd-check' + (ok ? ' ok' : '');
                el.querySelector('i').className = ok ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
            });
            const score = Object.values(checks).filter(Boolean).length;
            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
            const labels = ['Très faible', 'Faible', 'Moyen', 'Fort'];
            fill.style.width = (score / 4 * 100) + '%';
            fill.style.background = colors[score - 1] || '#ef4444';
            text.textContent = pwd.length ? labels[score - 1] || 'Très faible' : 'Entrez un mot de passe';
            text.style.color = colors[score - 1] || '#64748b';
        }

        function showAlert(type, msg) {
            const el = type === 'error' ? document.getElementById('alertError') : document.getElementById('alertSuccess');
            const msgEl = type === 'error' ? document.getElementById('alertErrMsg') : document.getElementById('alertSuccessMsg');
            msgEl.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function handleRegister(e) {
            e.preventDefault();
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');

            if (pwd !== confirm) {
                showAlert('error', 'Les mots de passe ne correspondent pas.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Création...';

            setTimeout(() => {
                const result = register(nom, email, pwd);

                if (result.success) {
                    showAlert('success', result.message);
                    document.getElementById('registerForm').reset();
                    document.getElementById('strengthFill').style.width = '0';
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Compte créé !';
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showAlert('error', result.message);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer mon compte';
                }
            }, 700);
        }
    </script>
</body>

</html>
